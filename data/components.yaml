# Every AWS AI stack component the workshop claims to cover, and where.
#
# A test enforces this file: every demo in the registry appears in at least
# one component; every component marked `covered: true` names at least one
# demo AND at least one slide id that exists in deck/content/*.yaml; every
# lineage id exists in data/lineage.yaml. `covered: false` is an explicit,
# reasoned exclusion - the `reason` says why.
#
# layers: models | safety | low-code | framework | agent-platform | protocols |
#         retrieval | ai-services | ml-platform | assistants | identity |
#         operations | local

schema_version: 1

components:

  # ---- Models -----------------------------------------------------------
  - id: bedrock-models
    name: Amazon Bedrock model inference (Converse, InvokeModel, streaming, token counting)
    layer: models
    lineage: [bedrock, converse-api, invoke-model-api]
    demos: [bedrock-runtime, strands-agent, decision]
    slides: [bedrock.converse, lineage.stack_today]
    covered: true

  - id: bedrock-openai-compatible
    name: OpenAI-compatible Responses and Chat Completions on Bedrock
