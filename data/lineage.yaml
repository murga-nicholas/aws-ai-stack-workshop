# Lifecycle and lineage of every AWS AI name the workshop mentions.
#
# One record per thing. The CLI (`awsai-demo lineage`), the glossary, the
# deck's lineage and timeline slides, and every demo's `lifecycle_refs`
# read these records - so a date is corrected here, once.
#
# Dates are quoted ISO strings; reduced precision ("2025-05") is used when
# AWS publishes only a month. `null` means "not announced", never "unknown
# to us": if we do not know, the field says so in `note`.
#
# normalized_status: active | preview | maintenance | sunset | legacy |
#                    end_of_life | renamed | moved
# relation (to successors): rename | successor | migration | merged | moved |
#                           built_on | none
#
# Verified 2026-10-05. Sources are the pages listed per record; see also
# docs/research.md section 10. Launch dates of services that predate 2023
# come from AWS launch announcements and were not re-verified on that date.

schema_version: 1
verified: "2026-10-05"

