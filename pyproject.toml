[project]
name = "aws-ai-stack-workshop"
version = "0.1.0"
description = "An honest, offline-first tour of the AWS AI stack."
requires-python = ">=3.12,<3.14"
dependencies = [
    "boto3==1.43.108",
    "botocore==1.43.108",
    "strands-agents[a2a]==1.57.2",
    "bedrock-agentcore==1.24.0",
    "openai==3.24.0",
    "pydantic>=2.12,<2.41.3",
    "PyYAML==6.0.3",
    "filelock>=3.20,<4",
    "cedarpy==4.12.1",
    "aws-bedrock-token-generator==1.1.0",
    "httpx==0.28.1",
]

[project.scripts]
awsai-demo = "awsai_demo.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.18,<2",
    "pytest>=8.4,<10",
    "pytest-cov>=7,<8",
    "coverage>=7.10,<8",
    "ruff>=0.12,<1",
    "types-PyYAML>=6,<7",
]
deck = ["python-pptx==1.0.2", "PyYAML==6.0.3"]
otel = ["opentelemetry-sdk==1.45.0", "opentelemetry-exporter-otlp-proto-http==1.45.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/awsai_demo", "deck"]

[tool.hatch.build.targets.wheel.force-include]
"data/lineage.yaml" = "awsai_demo/data/lineage.yaml"
"data/components.yaml" = "awsai_demo/data/components.yaml"
"data/aws_ai_stack_notes.md" = "awsai_demo/data/aws_ai_stack_notes.md"

[tool.pytest.ini_options]
addopts = "-q --strict-config --strict-markers --basetemp=.pytest_tmp --cov --cov-report=term-missing"
testpaths = ["tests"]
xfail_strict = true

[tool.coverage.run]
branch = true
parallel = true
source = ["awsai_demo", "scripts", "deck"]
patch = ["subprocess"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
exclude_lines = ["if TYPE_CHECKING:"]

[tool.ruff]
extend-exclude = [".uv-cache", ".uv-python", ".pytest_tmp*", ".awsai_runs", ".awsai_checkpoints"]
line-length = 79
target-version = "py312"

[tool.ruff.lint]
select = ["A", "ANN", "ARG", "B", "C4", "D", "DTZ", "E", "EM", "F", "I", "ICN", "LOG", "N", "PERF", "PIE", "PLC", "PLE", "PLW", "PTH", "RET", "RSE", "S", "SIM", "T10", "TC", "TRY", "UP", "W", "RUF"]
ignore = ["ANN401", "PLC0415"]

[tool.ruff.lint.per-file-ignores]
"deck/**" = ["N812"]
"tests/**" = ["D100", "D101", "D102", "D103", "D107", "S101", "SLF001"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pycodestyle]
max-doc-length = 72

[tool.ruff.format]
docstring-code-format = true
# Claude owns Markdown; Python snippets are checked against source later.
exclude = ["*.md"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
files = ["src/awsai_demo", "scripts", "deck"]
strict = true
exclude = ["^\\.venv/", "^\\.uv-cache/", "^\\.uv-python/"]
pretty = true
show_error_codes = true
warn_unused_configs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "botocore", "botocore.*"]
ignore_missing_imports = true

[tool.uv]
default-groups = ["dev", "otel", "deck"]
